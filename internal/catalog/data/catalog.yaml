# epg3r catalog: everything the app knows about leagues and teams.
#
# leagues: how a league is recognised in a playlist, what its airings are called, how long
#   games run, its Gracenote series id, and the channel-number block it owns. Fields:
#   key, name, airing_title, sport, color, logo_path, genre, duration, start_pad, series_id,
#   channel_base, slot_span (default 100), label_prefix, label_aliases, name_tokens,
#   group_patterns, name_patterns, exclude, roster, womens_roster, womens_airing_title,
#   womens_series_id. color is the brand hex the generated art is grounded in; logo_path is
#   the league's segment in the mark source's layout, which team logo_ids sit inside.
#
# rosters: one per Gracenote team list (a school has a separate entry per sport, each with
#   its own id). tms_brand_id is emitted as <team-id system="tms">; tms_team_id is the
#   franchise id kept for reference. aliases are extra spellings providers use that the
#   generated forms (full name, nickname, city, abbreviation) miss. Add one when a team
#   goes unmatched. logo_id is written by `make logo-ids`, not by hand: a team that has one
#   gets its real mark, and a team that does not is drawn from its name.
leagues:
  - key: nfl
    name: NFL
    airing_title: NFL Football
    sport: football
    color: '#013369'
    logo_path: nfl
    genre: Football
    duration: 3h30m
    start_pad: 15m
    series_id: '191277'
    channel_base: 8500
    label_prefix: NFL
    group_patterns:
      - ^nfl$
      - ^nfl\b
    roster: NFL
  - key: mlb
    name: MLB
    airing_title: MLB Baseball
    sport: baseball
    color: '#bf0d3e'
    logo_path: mlb
    genre: Baseball
    duration: 3h30m
    start_pad: 15m
    series_id: '191273'
    channel_base: 9500
    label_prefix: MLB
    group_patterns:
      - ^mlb\b
    roster: MLB
  - key: nba
    name: NBA
    airing_title: NBA Basketball
    sport: basketball
    color: '#c8102e'
    logo_path: nba
    genre: Basketball
    duration: 3h
    start_pad: 15m
    series_id: '191276'
    channel_base: 11500
    label_prefix: NBA
    group_patterns:
      - ^nba$
      - ^nba\b
    exclude:
      - g[- ]?league
      - ^nbag\b
    name_tokens: [NBALP, NBA LP]
    roster: NBA
  - key: nhl
    name: NHL
    airing_title: NHL Hockey
    sport: hockey
    color: '#1e2a3a'
    logo_path: nhl
    genre: Hockey
    duration: 3h
    start_pad: 15m
    series_id: '448880'
    channel_base: 12500
    label_prefix: NHL
    label_aliases:
      - NHL Game
    group_patterns:
      - ^nhl\b
    roster: NHL
  - key: wnba
    name: WNBA
    airing_title: WNBA Basketball
    sport: basketball
    color: '#f57b20'
    logo_path: wnba
    genre: Basketball
    duration: 2h30m
    start_pad: 15m
    series_id: '191289'
    channel_base: 13500
    label_prefix: WNBA
    group_patterns:
      - ^wnba\b
    roster: WNBA
  - key: mls

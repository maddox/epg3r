    color: '#1d4ed8'
    logo_path: soccer
    genre: Soccer
    duration: 2h
    start_pad: 15m
    series_id: '191274'
    channel_base: 10500
    label_prefix: MLS
    label_aliases:
      - \(Apple\) \(MLS\)
    group_patterns:
      - ^mls\b
    roster: MLS
  - key: ncaaf
    name: NCAA Football
    airing_title: College Football
    sport: football
    color: '#7c3aed'
    logo_path: ncaa
    genre: Football
    duration: 3h45m
    start_pad: 15m
    series_id: '191261'
    channel_base: 14500
    slot_span: 200
    label_prefix: NCAAF
    group_patterns:
      - ^ncaaf\b
      - ^ncaa football
      - ^college football
    roster: NCAA Football
  - key: ncaab
    name: NCAA Basketball

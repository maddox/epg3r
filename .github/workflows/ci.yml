name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l cmd internal scripts)" || (gofmt -l cmd internal scripts; exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: Check committed CSS is current
        run: sh scripts/tailwind.sh && git diff --quiet -- internal/web/static/app.css

  # A Dockerfile that will not build should fail the pull request, not the release. On main
  # the release job builds the same image for real, so this would be the second build.
  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Every push to main that passes the tests is a release: a version, an image carrying it,
  # a tag, and notes. The version is a UTC timestamp, so it needs no bump rule and sorts
  # chronologically as a plain string, which is what lets the app compare its own build
  # against the latest one.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag, and create the release
      packages: write # push to ghcr
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the notes are built from history

      - name: Pick a version
        id: version
        run: |
          set -euo pipefail
          version=$(date -u +%Y.%m.%d.%H%M)
          # Two pushes inside one minute: fall back to seconds. Still sorts correctly, since
          # 2026.09.10.1423 < 2026.09.10.142305 < 2026.09.10.1424 as strings.
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            version=$(date -u +%Y.%m.%d.%H%M%S)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Find the last release
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "tag=$(gh release view --json tagName -q .tagName 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        env:
          PREVIOUS: ${{ steps.previous.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Commits, listed here because most work lands on main directly and GitHub's
          # generated notes are built from pull requests. Its section is appended below,
          # so a release that did come from a PR carries both.
          fmt='* %s ([`%h`](https://github.com/${{ github.repository }}/commit/%H))'
          {
            echo "## Commits"
            echo
            if [ -n "$PREVIOUS" ]; then
              git log "$PREVIOUS..HEAD" --no-merges --format="$fmt"
              echo
              echo "**Full changelog**: https://github.com/${{ github.repository }}/compare/$PREVIOUS...$VERSION"
            else
              echo "_First release._"
              echo
              git log --no-merges --format="$fmt" -25
            fi
            echo
          } > notes.md
          cat notes.md

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # arm64 matters: this is a self-hosted app and plenty of people run it on a NAS or a
      # Pi. CGO is off and the SQLite driver is pure Go, so this cross-compiles and needs
      # no QEMU.
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # After the image, so a failed build leaves no tag pointing at a release nobody can run.
      - name: Tag the commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS: ${{ steps.previous.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # --generate-notes appends GitHub's own section, which names the pull requests and
          # the new contributors; --notes-start-tag points it at the same span as ours.
          args=(--title "$VERSION" --notes-file notes.md --generate-notes)
          if [ -n "$PREVIOUS" ]; then args+=(--notes-start-tag "$PREVIOUS"); fi
          gh release create "$VERSION" "${args[@]}"

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### Released \`$VERSION\`"
            echo
            echo "- Image: \`docker pull ${{ env.IMAGE }}:$VERSION\`"
            echo "- Notes: https://github.com/${{ github.repository }}/releases/tag/$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
